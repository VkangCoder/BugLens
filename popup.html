<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BugLens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Lucide icons (1.5px stroke), referenced with <use href="#i-name"> -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
        <path d="M2 12h20" />
      </symbol>
      <symbol id="i-circle" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
      </symbol>
      <symbol id="i-square" viewBox="0 0 24 24">
        <rect width="18" height="18" x="3" y="3" rx="2" />
      </symbol>
      <symbol id="i-circle-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="m9 12 2 2 4-4" />
      </symbol>
      <symbol id="i-circle-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" x2="12" y1="8" y2="12" />
        <line x1="12" x2="12.01" y1="16" y2="16" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </symbol>
      <symbol id="i-arrow-up-right" viewBox="0 0 24 24">
        <path d="M7 7h10v10" />
        <path d="M7 17 17 7" />
      </symbol>
      <symbol id="i-mouse-pointer-click" viewBox="0 0 24 24">
        <path d="M14 4.1 12 6" />
        <path d="m5.1 8-2.9-.8" />
        <path d="m6 12-1.9 2" />
        <path d="M7.2 2.2 8 5.1" />
        <path
          d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z"
        />
      </symbol>
    </svg>

    <main class="popup">
      <header class="popup-header">
        <span class="logo">
          <!-- Mark from assets/logo/buglens-mark.svg, heavier stroke below 24px as in the Logo component -->
          <svg
            class="logo-mark"
            viewBox="0 0 120 120"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M12 92C2 46 50 12 63 42C74 68 32 88 28 60C25 38 58 34 63 54C65 60 70 60 76 60L98 60"
              stroke="var(--fg-1)"
              stroke-width="9"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="105" cy="60" r="9.5" fill="var(--accent)" />
          </svg>
          <span class="logo-word">BugLens</span>
        </span>
        <span class="recording-indicator" id="recording-indicator" hidden>
          <span class="recording-dot"></span>
          <span class="recording-label">Recording</span>
          <span class="recording-elapsed" id="elapsed">00:00</span>
        </span>
      </header>

      <div class="site-row">
        <svg class="icon icon-sm"><use href="#i-globe" /></svg>
        <span class="site-url" id="site-url">—</span>
      </div>

      <!-- Idle -->
      <section class="view" id="view-idle" hidden>
        <div>
          <h2 class="title">Ready to record</h2>
          <p class="caption">
            Clicks on this tab are captured in order, with exact timing.
          </p>
        </div>
        <button
          type="button"
          class="btn btn-primary btn-lg btn-block"
          id="start"
        >
          <svg class="icon"><use href="#i-circle" /></svg>
          Start recording
        </button>
        <div class="meta-row">
          <span id="last-session"></span>
          <a href="http://localhost:3000/" id="open-dashboard"
            >Open dashboard</a
          >
        </div>
      </section>

      <!-- Recording -->
      <section class="view view-flush" id="view-recording" hidden>
        <div class="counter">
          <span class="counter-value" id="count">0</span>
          <span class="caption">events captured</span>
        </div>
        <ol class="feed" id="feed"></ol>
        <p class="feed-empty caption" id="feed-empty">
          Click anywhere on the page to capture the first event.
        </p>
        <footer class="popup-footer">
          <button type="button" class="btn btn-danger btn-block" id="stop">
            <svg class="icon"><use href="#i-square" /></svg>
            Stop &amp; save
          </button>
        </footer>
      </section>

      <!-- Uploading -->
      <section class="view" id="view-uploading" hidden>
        <div class="status">
          <svg class="icon icon-lg status-muted"><use href="#i-circle" /></svg>
          <div>
            <h2 class="title">Saving session</h2>
            <p class="caption" id="uploading-count"></p>
          </div>
        </div>
      </section>

      <!-- Upload failed -->
      <section class="view" id="view-failed" hidden>
        <div class="status">
          <svg class="icon icon-lg status-danger">
            <use href="#i-circle-alert" />
          </svg>
          <div>
            <h2 class="title">Upload failed. Session kept locally.</h2>
            <p class="caption mono" id="failed-message"></p>
          </div>
        </div>
        <button
          type="button"
          class="btn btn-primary btn-lg btn-block"
          id="retry"
        >
          Retry upload
        </button>
        <button type="button" class="btn btn-ghost btn-block" id="discard">
          Discard session
        </button>
      </section>

      <!-- Saved -->
      <section class="view" id="view-saved" hidden>
        <div class="status">
          <svg class="icon icon-lg status-success">
            <use href="#i-circle-check" />
          </svg>
          <div>
            <h2 class="title">Session saved</h2>
            <p class="caption" id="saved-count"></p>
          </div>
        </div>
        <div class="id-well">
          <span class="mono" id="saved-id"></span>
          <button
            type="button"
            class="icon-btn"
            id="copy-id"
            aria-label="Copy session ID"
            title="Copy session ID"
          >
            <svg class="icon icon-sm"><use href="#i-copy" /></svg>
          </button>
        </div>
        <button
          type="button"
          class="btn btn-primary btn-lg btn-block"
          id="open-session"
        >
          Open in dashboard
          <svg class="icon"><use href="#i-arrow-up-right" /></svg>
        </button>
        <button
          type="button"
          class="btn btn-ghost btn-block"
          id="record-another"
        >
          Record another
        </button>
      </section>
    </main>

    <script src="env.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
